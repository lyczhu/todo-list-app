openapi: 3.0.3
info:
  title: Todo List API
  description: >
    待办事项管理 RESTful 契约（001-todo-management）。服务端返回已按
    dueDate 升序、无 dueDate 垫底、同日按 createdAt 稳定排序的列表；
    overdue 由服务端日期判定。本特性无编辑、无重开完成状态。
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /todos:
    get:
      operationId: listTodos
      summary: 查询待办列表（可选按完成状态过滤）
      parameters:
        - name: status
          in: query
          required: false
          description: 分类查看。active=未完成，completed=已完成；缺省=全部（保持排序，分区由前端按 completed 字段渲染）
          schema:
            type: string
            enum: [active, completed]
      responses:
        "200":
          description: 已排序的事项集合（可为空数组）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      summary: 创建待办事项
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoCreate"
      responses:
        "201":
          description: 创建成功，返回完整实体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          description: 校验失败（标题空白/超长、描述超长、日期格式错误）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /todos/{id}:
    delete:
      operationId: deleteTodo
      summary: 删除待办事项（幂等语义：重复删除同一 id 返回 404）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 删除成功，无响应体
        "404":
          description: 事项不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /todos/{id}/complete:
    patch:
      operationId: completeTodo
      summary: 标记为完成（单向；对已完成事项重复调用幂等返回 200）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 更新后的实体（completed=true）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: 事项不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    TodoCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 去首尾空白后非空
        description:
          type: string
          maxLength: 2000
          default: ""
        dueDate:
          type: string
          format: date
          nullable: true
          description: ISO 日期 YYYY-MM-DD，可空；允许早于今天
    Todo:
      type: object
      required: [id, title, description, dueDate, completed, createdAt, overdue]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date
          nullable: true
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        overdue:
          type: boolean
          description: 服务端判定，dueDate < 今天 且未完成
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码，如 TITLE_REQUIRED / NOT_FOUND / VALIDATION_ERROR
        message:
          type: string
          description: 用户可理解的提示文案
